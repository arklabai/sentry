<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentry AI - Be Fearless Online</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sentry_theme_preference');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        overflow-x: hidden;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/sidepanel/main.tsx"></script>
  </body>
</html>
