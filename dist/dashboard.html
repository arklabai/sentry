<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentry AI — Be Fearless Online | Privacy Command Center</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sentry_theme_preference');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
      }
    </style>
    <script type="module" crossorigin src="./assets/dashboard.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/useTheme-2p04l4wm.js">

    <link rel="stylesheet" crossorigin href="./assets/useTheme.css">

</html>
